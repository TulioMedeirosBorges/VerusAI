<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VerusAI — Análises de Notícias</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="header">
    <div class="header-inner">
      <div class="logo">
        <span class="logo-v">V</span>erusAI
      </div>
      <p class="header-sub">Banco público de notícias verificadas</p>
    </div>
  </header>

  <main class="main">
    <section class="filtros">
      <input type="text" id="busca" placeholder="Buscar por URL ou título..." />
      <div class="filtro-btns">
        <button class="filtro-btn ativo" data-v="">Todos</button>
        <button class="filtro-btn" data-v="true">✅ Verdadeiro</button>
        <button class="filtro-btn" data-v="mixed">⚠️ Misto</button>
        <button class="filtro-btn" data-v="false">❌ Falso</button>
      </div>
    </section>

    <section class="stats" id="stats"></section>

    <section class="grid" id="grid">
      <div class="loading">Carregando análises...</div>
    </section>

    <div class="paginacao" id="paginacao"></div>
  </main>

  <!-- Modal de detalhe -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal" id="modal">
      <button class="modal-fechar" id="modalFechar">✕</button>
      <div id="modalConteudo"></div>
    </div>
  </div>

  <!-- Painel admin -->
  <div class="admin-toggle" id="adminToggle" title="Admin">⚙</div>
  <div class="admin-panel" id="adminPanel">
    <h3>Painel Admin</h3>
    <input type="password" id="adminKey" placeholder="Chave admin" />
    <input type="text" id="adminUrl" placeholder="URL para remover" />
    <button id="adminRemover">Remover análise</button>
    <p id="adminMsg"></p>
  </div>

  <script src="app.js"></script>
</body>
</html>

<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VerusAI</title>
    <link rel="stylesheet" href="register.css" />
  </head>
  <body id="bodyExtensionRegister">
    <header id="headerPageRegister">
      <div class="headerRegister">
        <img id="logoRegister" src="/assets/images/VerusIAAtivo 1.svg" alt="" />
      </div>
    </header>
    <main>
      <div class="mainRegister">
        <div class="inputRegister">
          <div class="nameUser">
            <label for="userName">Nome (opcional)</label>
            <input type="text" id="userName" placeholder="Digite seu nome" />
          </div>
          <div class="E-mailRegister">
            <label for="E-mailRegister">E-mail</label>
            <input type="email" id="E-mailRegister" placeholder="Digite seu e-mail" />
            <span class="erro" id="erroEmail"></span>
          </div>
          <div class="SenhaRegister">
            <label for="PasswordRegister">Senha</label>
            <input type="password" id="PasswordRegister" placeholder="Digite sua senha" />
            <div class="senha-forca" id="senha-forca">
              <div class="senha-forca-barra"></div>
              <div class="senha-forca-barra"></div>
              <div class="senha-forca-barra"></div>
            </div>
            <p class="senha-forca-texto" id="senha-forca-texto"></p>
            <span class="erro" id="erroSenha"></span>
          </div>
          <div class="SenhaConfirmRegister">
            <label for="PasswordConfirmRegister">Confirme sua senha</label>
            <input type="password" id="PasswordConfirmRegister" placeholder="Digite sua senha novamente" />
            <span class="erro" id="erroSenhaConfirm"></span>
          </div>
        </div>
        <div class="buttonRegister">
          <button id="confirmRegister"><p>Criar conta</p></button>
          <div class="login">
            <p>J&aacute; tem uma conta? <a href="../login/login.html">Entrar</a></p>
          </div>
        </div>
      </div>
    </main>

    <div id="telaSuccesso" class="tela-sucesso">
      <div class="sucesso-conteudo">
        <div id="checkIcon"></div>
        <p>Cadastro realizado <br />com sucesso!</p>
      </div>
    </div>

    <script type="module" src="register.js"></script>
  </body>
</html>

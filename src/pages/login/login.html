<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="login.css" />
    <title>VerusAI</title>
  </head>
  <body id="bodyExtension">
    <header id="headerPage">
      <div class="header">
        <div class="img">
          <img id="logo" src="/assets/images/VerusIAAtivo 1.svg" alt="" />
        </div>
        <div class="menu">
          <div id="closeIcon"></div>
        </div>
      </div>
    </header>
    <main>
      <div class="main">
        <div class="input">
          <div class="E-mail">
            <label for="E-mail">E-mail</label>
            <input
              type="email"
              id="E-mail"
              placeholder="Digite seu e-mail"
            />
            <span class="erro" id="erroEmail"></span>
          </div>
          <div class="Senha">
            <label for="Password">Senha</label>
            <input
              type="password"
              id="Password"
              placeholder="Digite sua senha"
            />
            <span class="erro" id="erroSenha"></span>
          </div>
        </div>

        <div class="esqueci_senha">
          <a id="linkEsqueciSenha" href="#">Esqueci a senha</a>
        </div>

        <div class="button">
          <div class="buttonConfirm">
            <button id="confirm"><p>Confirmar</p></button>
          </div>
          <div class="googleButton">
            <button class="google" id="Google">
              <div id="googleIcon"></div>
              <p>Continuar com Google</p>
            </button>
          </div>
          <div class="logup">
            <p>N&atilde;o tem uma conta? <a href="../register/register.html">Criar conta</a></p>
          </div>
        </div>
      </div>
    </main>
    <script type="module" src="login.js"></script>
  </body>
</html>

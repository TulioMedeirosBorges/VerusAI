<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=, initial-scale=1.0" />
    <link rel="stylesheet" href="/style/style.css" />
    <title>Document</title>
  </head>
  <body>
    <aside id="sidebar_id">
      <header id="headerPage">
        <div class="img">
          <img id="logo" src="/assets/image/LogoAosFatosAtivo 2.svg" alt="" />
        </div>
        <div class="tm_stt">
          <div class="tema">
            <div class="retangleTema">
              <div class="circleTema">
                <div id="darkmode"></div>
              </div>
            </div>
          </div>
          <div class="menu">
            <div id="settings"></div>
          </div>
        </div>
      </header>
      <div id="confiabilit">
        <div class="titleconf">
          <div class="conftext">
            <p>CONFIABILIDADE</p>
          </div>
          <div class="porcentconf">
            <p>ALTA</p>
            <div id="porcent">
              <p>98%</p>
            </div>
          </div>
        </div>
        <div class="confiabilitbar">
          <div id="confbar"></div>
        </div>
      </div>
      <main class="pop">
        <h1 class="result">Resultado da Verificação</h1>
        <p id="textAnalysis"></p>
        <div id="footerAnalysis"></div>
      </main>
      <footer>
        <div class="chat">
          <input
            type="text"
            class="chat"
            id="chat"
            placeholder="Faça sua pergunta..."
          />
        </div>
      </footer>
    </aside>
    <script type="module" src="/js/public/chat.js"></script>
  </body>
</html>
